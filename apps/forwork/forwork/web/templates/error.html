{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="empty-state">
  <span class="feature-icon">{{ m.icon("alert") }}</span>
  <h1>{{ {400: "That did not work", 401: "Signed out", 403: "Not allowed", 404: "Not found", 413: "Too large"}.get(code, "Something went wrong") }}</h1>
  <p>{{ message }}</p>
  <p><a class="btn" href="{{ url_for('ui.home') }}">Go to Home</a></p>
</div>
{% endblock %}
